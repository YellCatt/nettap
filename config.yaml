# ==========================================================================
# Nettap 并发请求工具配置文件
# 修改后重启程序生效
# ==========================================================================

# ------------------------- 执行模式 -------------------------

# 是否开启全力模式（true=不停发请求，压测到底，忽略 interval 和 once）
full_power: false

# 执行间隔，支持的格式: 30s / 5m / 1h / 2h30m
# full_power: false 时生效
interval: "1h"

# 是否只执行一轮后退出
# true=只跑一轮就退出，false=持续运行
once: false

# ------------------------- 并发设置 -------------------------

# 每个接口的并发请求数
# 设为 0 或不填 = 自动计算
#   - 定时模式 / 单次执行: 自动 = 1
#   - 全力模式:           自动 = CPU核心数 × 10
# 手动填 >0 就覆盖自动值
concurrency: 0

# ------------------------- 请求设置 -------------------------

# 单个请求的超时时间（秒），超时后该请求记为失败
timeout_seconds: 15